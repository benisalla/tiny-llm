<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Tiny LLM logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="304" height="304" rx="64" fill="url(#bg)"/>
  <rect x="8" y="8" width="304" height="304" rx="64" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>

  <!-- attention arcs: each token looks back at earlier ones -->
  <g fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M110 70 Q135 38 160 70"/>
    <path d="M110 70 Q160 18 210 70"/>
    <path d="M160 70 Q185 38 210 70"/>
  </g>
  <g fill="#f0abfc">
    <circle cx="110" cy="72" r="8"/>
    <circle cx="160" cy="72" r="8"/>
    <circle cx="210" cy="72" r="8"/>
  </g>

  <!-- a tiny stack of transformer layers -->
  <g fill="url(#layer)">
    <rect x="84" y="96" width="152" height="24" rx="12"/>
    <rect x="84" y="130" width="152" height="24" rx="12" opacity="0.8"/>
    <rect x="84" y="164" width="152" height="24" rx="12" opacity="0.6"/>
  </g>

  <text x="160" y="250" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="46" font-weight="800" letter-spacing="1" fill="#f8fafc">Tiny <tspan fill="#22d3ee">LLM</tspan></text>
  <text x="160" y="280" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="3" fill="#94a3b8">FROM SCRATCH</text>
</svg>
